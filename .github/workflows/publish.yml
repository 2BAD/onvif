name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: check versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./packages/onvif/package.json').version")
          for manifest in packages/*/package.json; do
            PACKAGE_VERSION=$(node -p "require('./$manifest').version")
            if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
              echo "::error::$manifest is at $PACKAGE_VERSION, expected $VERSION"
              exit 1
            fi
          done
          if [[ "${RELEASE_TAG#v}" != "$VERSION" ]]; then
            echo "::error::release $RELEASE_TAG does not match version $VERSION"
            exit 1
          fi
      - name: determine dist-tag
        id: dist-tag
        run: |
          VERSION=$(node -p "require('./packages/onvif/package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: publish
        env:
          NPM_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: pnpm --filter './packages/*' publish --provenance --access public --no-git-checks --tag "$NPM_TAG"
